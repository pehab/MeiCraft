plugins { id 'com.android.application' }
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def signingPassword = rootProject.file('.signing/password')
def signingKey = rootProject.file('.signing/keystore.p12')
android {
 namespace 'de.meiapps.meicraft'
 compileSdk 35
 defaultConfig { applicationId 'de.meiapps.meicraft'; minSdk 26; targetSdk 35; versionCode appVersion.getProperty('versionCode').toInteger(); versionName appVersion.getProperty('versionName') }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (signingPassword.exists() && signingKey.exists()) {
  signingConfigs { stable { storeFile signingKey; storePassword signingPassword.text.trim(); keyAlias 'meicraft'; keyPassword signingPassword.text.trim() } }
  buildTypes { debug { signingConfig signingConfigs.stable }; release { signingConfig signingConfigs.stable } }
 }
}
