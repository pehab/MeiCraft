name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: World tests
        run: bash test.sh
      - name: Restore release signing key when configured
        if: github.event_name != 'pull_request'
        env:
          MEICRAFT_SIGNING_JSON: ${{ secrets.MEICRAFT_SIGNING_JSON }}
        run: python3 scripts/restore-signing.py
      - name: Build native APK and smoke APK
        run: |
          bash build-local.sh
          bash test-android-build.sh
      - name: Android Gradle build and lint
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            build/reports/
            build/android-smoke.log
            build/smoke.png
            app/build/reports/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify first release APK
        run: |
          cd dist
          sha256sum --check meiCraft-0.1.0.apk.sha256
      - name: Publish first playable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 dist/meiCraft-0.1.0.apk dist/meiCraft-0.1.0.apk.sha256 --target "$GITHUB_SHA" --title 'meiCraft 0.1.0 · Offline-Kreativwelt' --notes-file docs/RELEASE-0.1.0.md
          fi
