name: Android
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [30, '37.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          MANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$MANAGER" --licenses > /dev/null
          set -o pipefail
          "$MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: World tests
        run: bash test.sh
      - name: Restore release signing key when configured
        if: github.event_name != 'pull_request'
        env:
          MEICRAFT_SIGNING_JSON: ${{ secrets.MEICRAFT_SIGNING_JSON }}
        run: python3 scripts/restore-signing.py
      - name: Build native APK and smoke APK
        id: native
        run: |
          bash build-local.sh
          bash scripts/build-upgrade-fixture.sh
          bash test-android-build.sh
      - name: Android Gradle build and lint
        run: bash gradlew --no-daemon --warning-mode=fail assembleDebug lintDebug
      - name: Enable emulator acceleration
        if: always() && steps.native.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android smoke test
        if: always() && steps.native.outcome == 'success'
        env:
          TEST_API: ${{ matrix.api }}
        run: bash scripts/run-emulator.sh
      - name: Package APK from the validated source
        run: python3 scripts/prepare-release.py
      - uses: actions/upload-artifact@v6
        if: matrix.api == 30
        with:
          name: verified-release
          path: build/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Android-validation-${{ matrix.api }}
          path: |
            build/android-crash.log
            build/emulator.log
            build/reports/
            build/android-smoke.log
            build/android-update-seed.log
            build/smoke.png
            build/portrait.png
            build/failure.png
            app/build/reports/
  verify-release-package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Download verified release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name verified-release --dir build/release
      - name: Verify packaged APK checksum
        working-directory: build/release
        run: sha256sum --check *.apk.sha256
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: verify-release-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download verified release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name verified-release --dir build/release
      - name: Verify signed release APK
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          cd build/release
          sha256sum --check "meiCraft-$VERSION.apk.sha256"
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" "build/release/meiCraft-$VERSION.apk" "build/release/meiCraft-$VERSION.apk.sha256" build/release/meiCraft-update.json --target "$GITHUB_SHA" --title "meiCraft $VERSION" --notes-file "docs/RELEASE-$VERSION.md"
          fi
